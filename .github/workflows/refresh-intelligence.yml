name: Refresh Darwin job intelligence

on:
  workflow_dispatch:
  schedule:
    # 06:40 Darwin (ACST) every day.
    - cron: "10 21 * * *"

permissions:
  contents: write

concurrency:
  group: "job-intelligence-refresh"
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Refresh sources, expiry, dedupe and market history
        run: python scripts/intelligence_pipeline.py

      - name: Commit changed intelligence data
        run: |
          if git diff --quiet -- data/jobs.json data/skill_summary.json data/market_history.json; then
            echo "No intelligence changes."
            exit 0
          fi
          git config user.name "darwin-job-intelligence-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/skill_summary.json data/market_history.json
          git commit -m "data: refresh Darwin job intelligence"
          git push
