name: Refresh Darwin job intelligence

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/intelligence_pipeline.py"
      - "data/source_catalog.json"
      - "requirements.txt"
      - ".github/workflows/refresh-intelligence.yml"
  schedule:
    # 06:40 Darwin (ACST) every day.
    - cron: "10 21 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "job-intelligence-refresh"
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector dependencies
        run: pip install -r requirements.txt

      - name: Refresh sources, expiry, dedupe and market history
        run: python scripts/intelligence_pipeline.py

      - name: Commit changed intelligence data
        run: |
          if git diff --quiet -- data/jobs.json data/skill_summary.json data/market_history.json; then
            echo "No intelligence changes."
          else
            git config user.name "darwin-job-intelligence-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/jobs.json data/skill_summary.json data/market_history.json
            git commit -m "data: refresh Darwin job intelligence"
            git pull --rebase origin main
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install app dependencies
        run: npm install

      - name: Build refreshed dashboard
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

      - name: Deploy refreshed intelligence to GitHub Pages
        uses: actions/deploy-pages@v4
