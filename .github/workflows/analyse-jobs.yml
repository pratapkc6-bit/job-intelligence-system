name: Analyse job skills

on:
  workflow_dispatch:
  push:
    paths:
      - "data/jobs.json"
      - "scripts/analyse_jobs.py"
  schedule:
    # 21:45 UTC = 07:15 ACST (Darwin) year-round.
    - cron: "45 21 * * *"

permissions:
  contents: read

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run skill analysis
        run: python scripts/analyse_jobs.py

      - name: Show generated summary
        run: cat data/skill_summary.json
